name: .NET 10 build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HWMetrics.csproj

      - name: Build Release
        run: dotnet build HWMetrics.csproj --configuration Release --no-restore

      - name: Run RM Monitor tests
        run: dotnet test tests/RMMonitor.Tests/RMMonitor.Tests.csproj --configuration Release
