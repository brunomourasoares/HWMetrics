name: Publish Windows x64 artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/WaterCoolerApp.Tests/WaterCoolerApp.Tests.csproj --configuration Release

      - name: Restore Windows x64 runtime assets
        run: dotnet restore HWMetrics.csproj --runtime win-x64

      - name: Publish self-contained Windows x64
        run: dotnet publish HWMetrics.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/HW-Metrics-win-x64

      - name: Audit published output for legacy WinRing0 indicators
        shell: pwsh
        run: |
          $root = Resolve-Path "artifacts/HW-Metrics-win-x64"
          $sysFiles = @(Get-ChildItem $root -Recurse -File -Filter "*.sys")
          if ($sysFiles.Count -gt 0) {
            $paths = $sysFiles.FullName -join ", "
            throw "Unexpected kernel driver files found in publish output: $paths"
          }

          $matches = @()
          $inspectionErrors = @()
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $path = $_.FullName
            try {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $text = [System.Text.Encoding]::ASCII.GetString($bytes)
              if ($text -match "WinRing0|WinRing0x64|WinRing0_1_2") {
                $matches += $path
              }
            } catch {
              $inspectionErrors += "${path}: $($_.Exception.Message)"
            }
          }
          if ($inspectionErrors.Count -gt 0) {
            throw ("Could not inspect all published files: " + ($inspectionErrors -join "; "))
          }
          if ($matches.Count -gt 0) {
            throw ("Legacy WinRing0 indicators found in published files: " + ($matches -join ", "))
          }
          Write-Host "No .sys driver files or legacy WinRing0 string indicators found in published output."
          
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: HW-Metrics-win-x64
          path: artifacts/HW-Metrics-win-x64/
          if-no-files-found: error
          retention-days: 14
