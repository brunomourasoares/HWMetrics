name: Publish Windows x64 artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/WaterCoolerApp.Tests/WaterCoolerApp.Tests.csproj --configuration Release

      - name: Restore Windows x64 runtime assets
        run: dotnet restore HWMetrics.csproj --runtime win-x64

      - name: Publish self-contained Windows x64
        run: dotnet publish HWMetrics.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/RM-Monitor-win-x64

      - name: Audit published output for legacy WinRing0 indicators
        shell: pwsh
        run: |
          $root = Resolve-Path "artifacts/RM-Monitor-win-x64"
          $driverFiles = @(Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Extension -in @(".sys", ".inf", ".cat") -or $_.Name -match "^(WinRing0|WinRing0x64|WinRing0_1_2)(\.|$)"
          })
          if ($driverFiles.Count -gt 0) {
            $paths = $driverFiles.FullName -join ", "
            throw "Unexpected legacy kernel driver artifacts found in publish output: $paths"
          }

          $matchedFiles = @()
          $inspectionErrors = @()
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $path = $_.FullName
            try {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $text = [System.Text.Encoding]::ASCII.GetString($bytes)
              if ($text -match "WinRing0|WinRing0x64|WinRing0_1_2") {
                # RAMSPDToolkit-NDD is the upstream "No Default Drivers" build.
                # It retains API/enum identifiers but excludes the WinRing0 implementation and embedded driver binaries.
                # Keep auditing every other published file for legacy driver indicators.
                if ($_.Name -ne "RAMSPDToolkit-NDD.dll") {
                  $matchedFiles += $path
                }
              }
            } catch {
              $inspectionErrors += "${path}: $($_.Exception.Message)"
            }
          }
          if ($inspectionErrors.Count -gt 0) {
            throw ("Could not inspect all published files: " + ($inspectionErrors -join "; "))
          }
          if ($matchedFiles.Count -gt 0) {
            throw ("Legacy WinRing0 indicators found in published files: " + ($matchedFiles -join ", "))
          }
          Write-Host "No legacy driver files found; all published files except the reviewed RAMSPDToolkit-NDD assembly are free of WinRing0 string indicators."
          
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: HW-Metrics-win-x64
          path: artifacts/RM-Monitor-win-x64/
          if-no-files-found: error
          retention-days: 14
