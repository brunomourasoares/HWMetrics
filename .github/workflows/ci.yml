name: .NET 10 CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test tests/RMMonitor.Tests/RMMonitor.Tests.csproj --configuration Release

      - name: Restore Windows x64 assets
        run: dotnet restore HWMetrics.csproj --runtime win-x64

      - name: Build Windows x64
        run: dotnet build HWMetrics.csproj --configuration Release --runtime win-x64 --no-restore
